const AT_URL=`https://api.airtable.com/v0/${AT_BASE}`;
const AT_HDR={"Authorization":`Bearer ${AT_TOKEN}`,"Content-Type":"application/json"};

async function atList(table){
  const recs=[];let offset=null;
  do{
    const u=`${AT_URL}/${encodeURIComponent(table)}?pageSize=100${offset?`&offset=${offset}`:""}`;
    const r=await fetch(u,{headers:AT_HDR});
    if(!r.ok)throw new Error(`Error cargando ${table}`);
    const d=await r.json();
    recs.push(...d.records);offset=d.offset;
  }while(offset);
  return recs;
}
async function atCreate(table,fields){
  const r=await fetch(`${AT_URL}/${encodeURIComponent(table)}`,{method:"POST",headers:AT_HDR,body:JSON.stringify({records:[{fields}]})});
  if(!r.ok)throw new Error(`Error guardando en ${table}`);
  const d=await r.json();return d.records[0];
}
async function atDelete(table,id){
  const r=await fetch(`${AT_URL}/${encodeURIComponent(table)}/${id}`,{method:"DELETE",headers:AT_HDR});
  if(!r.ok)throw new Error(`Error al borrar en ${table}`);
  return r.json();
}
async function atUpdate(table,id,fields){
  const r=await fetch(`${AT_URL}/${encodeURIComponent(table)}/${id}`,{method:"PATCH",headers:AT_HDR,body:JSON.stringify({fields})});
  if(!r.ok)throw new Error(`Error actualizando ${table}`);
  return r.json();
}

// ── Helpers ────────────────────────────────────────────────────────────────────
const nowTs=()=>new Date().toISOString().slice(0,16);
const fmtTs=ts=>{const d=new Date(ts);return d.toLocaleDateString("es-PY")+" "+d.toLocaleTimeString("es-PY",{hour:"2-digit",minute:"2-digit"});};
const fmtHora=ts=>new Date(ts).toLocaleTimeString("es-PY",{hour:"2-digit",minute:"2-digit"});
const diasHasta=f=>{if(!f)return null;return Math.round((new Date(f)-new Date())/(1000*60*60*24));};
function duracion(a,b){if(!a||!b)return null;const m=Math.round((new Date(b)-new Date(a))/60000);if(m<=0)return null;const h=Math.floor(m/60),mm=m%60;return h>0?(mm>0?h+"h "+mm+"m":h+"h"):mm+"m";}
const esFin=t=>t.includes("Fin de dragado")&&t.includes("navegación");
const esFinSolo=t=>t==="Fin de dragado";
const esFinCualquiera=t=>esFin(t)||esFinSolo(t);
const esRainbow=t=>t.includes("rainbow");
const esNav=t=>t.includes("navegación")||t.includes("Arrastre");
const fmtTsCsv=ts=>{if(!ts)return"";try{const d=new Date(ts);const dd=String(d.getDate()).padStart(2,"0");const mm=String(d.getMonth()+1).padStart(2,"0");const yy=d.getFullYear();const hh=String(d.getHours()).padStart(2,"0");const mn=String(d.getMinutes()).padStart(2,"0");return dd+"/"+mm+"/"+yy+" "+hh+":"+mn;}catch{return ts;}};

:#A11C27}@media print{.sec{page-break-inside:avoid}}</style></head><body><div class="hdr"><div><div class="logo">DDP</div><div class="logos">Dragados del Paraguay</div></div><div><div class="dt">${titulo}</div><div class="dm">N° ${numero||"—"} · ${fecha||new Date().toLocaleDateString("es-PY")}</div></div></div>${secHTML}<div class="firma-s"><div class="firma-b"><div class="firma-l">Elaborado por</div><div class="firma-n">${(firmante&&firmante.nombre)||"__________________________"}</div><div class="firma-c">${(firmante&&firmante.cargo)||""}</div><div class="firma-line"></div><div style="font-size:8pt;color:#8a8aaa;margin-top:4px">Firma</div></div><div class="firma-b"><div class="firma-l">Aprobado por</div><div class="firma-n">__________________________</div><div class="firma-c">&nbsp;</div><div class="firma-line"></div><div style="font-size:8pt;color:#8a8aaa;margin-top:4px">Firma</div></div></div><div class="footer"><span><span class="conf">CONFIDENCIAL</span> · DDP · Sistema Operativo</span><span>Generado: ${new Date().toLocaleString("es-PY")}</span></div><script>window.onload=()=>window.print();<\/script></body></html>`;
  const b=new Blob([html],{type:"text/html;charset=utf-8"});

function exportarCSV(nombre,cabeceras,filas){
  const SEP=";";
  const esc=v=>{
    const s=String(v===null||v===undefined?"":v);
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const rows=[cabeceras,...filas].map(r=>r.map(esc).join(SEP));
  const csv="\ufeff"+rows.join("\r\n");
  const b=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u;a.download=nombre+".csv";
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
function Dashboard({eventos,mant,inc,alarmas,inv,navTo}){
  const venc=mant.filter(m=>m.est==="vencido");
  const incAb=inc.filter(i=>i.est!=="Cerrado");
  const tonH=eventos.filter(e=>esFin(e.tipo)).reduce((s,e)=>s+(e.ton||0),0);
  const pedidos=inv.filter(i=>i.cant<i.min&&i.min>0);
  const ulAl=alarmas.length?alarmas[alarmas.length-1]:null;
  const dAl=ulAl?diasHasta(ulAl.prox):null;

  const alertas=[
    ...venc.slice(0,3).map(m=>({sev:"a",msg:"MANT. VENCIDO · "+m.barco+" · "+m.tarea,page:"mantenimiento",id:m.id})),
    ...incAb.slice(0,2).map(i=>({sev:"a",msg:"INCIDENTE ABIERTO · "+i.nro+" · "+i.desc.slice(0,50),page:"incidentes",id:i.id})),
    ...pedidos.slice(0,2).map(i=>({sev:"a",msg:"PEDIDO URGENTE · "+i.sala+" · "+i.desc.slice(0,45),page:"inventario",id:i.id})),
    ...(dAl!==null&&dAl<=7?[{sev:"m",msg:"ALARMAS SENTINA · Próxima en "+dAl+" días ("+ulAl.prox+")",page:"alarmas",id:null}]:[]),
    ...(!venc.length&&!incAb.length&&!pedidos.length&&(dAl===null||dAl>7)?[{sev:"b",msg:"✓ Sin alertas críticas activas.",page:null,id:null}]:[]),
  ];

  // Calculate real efficiency per turno from eventos
  const turnosReales=[...new Set(eventos.filter(e=>esFin(e.tipo)).map(e=>e.turno))].sort();
  const tdatos=turnosReales.map(t=>{
    const evT=eventos.filter(e=>esFin(e.tipo)&&e.turno===t);
    const ton=evT.reduce((s,e)=>s+(e.ton||0),0);
    return{l:"Turno "+t,ton,pct:0};
  });
  const maxTon=Math.max(...tdatos.map(t=>t.ton),1);
  tdatos.forEach(t=>t.pct=Math.round((t.ton/maxTon)*100));

  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Dashboard</div></div>
    <div className="ps">{new Date().toLocaleDateString("es-PY",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
    <div className="g4">
      {[
        {l:"Producción Hoy",v:tonH.toLocaleString(),u:"ton",sub:eventos.filter(e=>esFin(e.tipo)).length+" pasadas",ok:true,ac:"#313280"},
        {l:"Total Período",v:eventos.filter(e=>esFin(e.tipo)).reduce((s,e)=>s+(e.ton||0),0).toLocaleString(),u:"ton",sub:eventos.filter(e=>esFin(e.tipo)).length+" pasadas totales",ok:true,ac:"#313280"},
        {l:"Mant. Vencidos",v:venc.length,u:"",sub:venc.length?"Requieren acción":"Sin vencidos",ok:!venc.length,ac:venc.length?"#A11C27":"#16a34a"},
        {l:"Pedidos Urgentes",v:pedidos.length,u:"",sub:pedidos.length?"Stock bajo mínimo":"Inventario OK",ok:!pedidos.length,ac:pedidos.length?"#A11C27":"#16a34a"},
      ].map((k,i)=><div key={i} className="kpi" style={{borderTop:"3px solid "+k.ac}}>
        <div className="kl">{k.l}</div><div className="kv">{k.v}<span className="ku">{k.u}</span></div>
        <div className={k.ok?"kok":"knok"}>{k.ok?"▲":"▼"} {k.sub}</div>
      </div>)}
    </div>
    <div className="g21">
      <div className="card">
        <CT>Alertas Activas — click para detalle</CT>
        {alertas.map((a,i)=><div key={i} className={"alert alert-"+a.sev} onClick={()=>a.page&&navTo(a.page,a.id)}>
          <div className={"adot adot-"+a.sev}/><span style={{fontSize:12,flex:1,fontWeight:500}}>{a.msg}</span>
          {a.page&&<span style={{color:"#8a8aaa",fontSize:16}}>›</span>}
        </div>)}
      </div>
      <div className="card">
        <CT>Eficiencia por Turno</CT>
        {tdatos.length===0&&<div style={{fontSize:13,color:"#8a8aaa",textAlign:"center",padding:"20px 0"}}>Sin datos de producción registrados</div>}
      {tdatos.map((t,i)=><div key={i} style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
            <span style={{fontSize:12,fontWeight:600}}>{t.l}</span>
            <span style={{fontSize:13,fontWeight:800,color:t.pct>=90?"#16a34a":t.pct>=80?"#d97706":"#A11C27"}}>{t.pct}%</span>
          </div>
          <div style={{fontSize:10,color:"#8a8aaa",marginBottom:4}}>{t.ton.toLocaleString()} ton · 4h</div>
          <PBar pct={t.pct} color={t.pct>=90?"#16a34a":t.pct>=80?"#d97706":"#A11C27"}/>
        </div>)}
      </div>
    </div>
    <div className="card">
      <CT>Últimos Eventos Registrados</CT>
      {eventos.slice(0,6).map((e,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 0",borderBottom:"1px solid rgba(226,228,234,.4)"}}>
        <div style={{fontSize:11,color:"#8a8aaa",fontWeight:700,minWidth:36}}>{fmtHora(e.ts)}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:12,fontWeight:500,color:e.tipo.includes("mantenim")?"#A11C27":"#1a1a2e"}}>{e.tipo}</div>
          <div style={{fontSize:10,color:"#8a8aaa"}}>Turno {e.turno}</div>
        </div>
        {e.ton&&<div style={{fontSize:13,fontWeight:800,color:"#313280"}}>{e.ton.toLocaleString()} t</div>}
      </div>)}
      {!eventos.length&&<div style={{fontSize:13,color:"#8a8aaa",textAlign:"center",padding:"20px 0"}}>Sin eventos registrados hoy</div>}
    </div>
  </div>;
}

// ── Reporte Operativo ──────────────────────────────────────────────────────────
function ReporteOp({eventos,setEventos,user,turnos,tipos}){
  const iF={tsA:true,tsM:nowTs(),tipo:tipos[0]||"Inicio de dragado",turno:turnos[0]?turnos[0].id:"A",ton:"",m3:"",kd:"",kh:"",det:"",tipoCalculo:"manual",aftUllages:["","","","","",""],foreUllages:["","","","","",""],rainbowHoras:""};
  const[form,setForm]=useState(iF);
  const[saved,setSaved]=useState(false);
  const[saving,setSaving]=useState(false);
  const[errMsg,setErrMsg]=useState("");
  const[ff,setFf]=useState("");
  const canEdit=["gerente","capitan","oficial"].includes(user.role);
  const isF=esFinCualquiera(form.tipo);
  const isFinNav=esFin(form.tipo);
  const isN=esNav(form.tipo);

  const onTipoChange=t=>{
    let tc=form.tipoCalculo;
    if(esRainbow(t)||esFinSolo(t)) tc="rainbow";
    setForm({...form,tipo:t,tipoCalculo:tc});
  };

  const lastRainbow=eventos.find(e=>esRainbow(e.tipo)&&e.tipo.includes("Inicio"));
  const autoTs=form.tsA?nowTs():form.tsM;
  let autoHoras="";
  if(lastRainbow){
    const diffMin=(new Date(autoTs)-new Date(lastRainbow.ts))/60000;
    if(diffMin>0) autoHoras=(diffMin/60).toFixed(2);
  }
  const horasRainbow=form.rainbowHoras||autoHoras;
  const m3Rainbow=horasRainbow>0?calcM3Rainbow(Number(horasRainbow)):0;

  const updateAft=(i,v)=>{
    const a=[...form.aftUllages];a[i]=v;
    const r=a.every(x=>x!=="")&&form.foreUllages.every(x=>x!=="")?calcM3Bodega(a.map(Number),form.foreUllages.map(Number)):null;
    setForm({...form,aftUllages:a,m3:r?String(r.total):""});
  };
  const updateFore=(i,v)=>{
    const f=[...form.foreUllages];f[i]=v;
    const r=form.aftUllages.every(x=>x!=="")&&f.every(x=>x!=="")?calcM3Bodega(form.aftUllages.map(Number),f.map(Number)):null;
    setForm({...form,foreUllages:f,m3:r?String(r.total):""});
  };
  const bodegaRes=(form.aftUllages.every(v=>v!=="")&&form.foreUllages.every(v=>v!==""))?calcM3Bodega(form.aftUllages.map(Number),form.foreUllages.map(Number)):null;

  const submit=async()=>{
    if(!form.tipo||saving)return;
    setSaving(true);setErrMsg("");
    const nuevo={ts:form.tsA?nowTs():form.tsM,tipo:form.tipo,turno:form.turno,ton:isF&&form.ton?Number(form.ton):null,m3:isF&&form.m3?Number(form.m3):null,kd:isFinNav&&form.kd?Number(form.kd):null,kh:isFinNav&&form.kh?Number(form.kh):null,det:form.det,auto:form.tsA};
    try{
      const rec=await atCreate("Eventos",mappers.Eventos.to(nuevo));
      setEventos(prev=>[{...nuevo,_id:rec.id,id:rec.id},...prev]);
      setForm(iF);setSaved(true);setTimeout(()=>setSaved(false),3000);
    }catch(e){setErrMsg(e.message);}
    setSaving(false);
  };

  const evConDur=eventos.map((e,i)=>({...e,dur:i>0?duracion(e.ts,eventos[i-1].ts):null}));
  const filtrados=ff?eventos.filter(e=>e.ts&&e.ts.startsWith(ff)):eventos;
  const tonT=filtrados.filter(e=>esFinCualquiera(e.tipo)).reduce((s,e)=>s+(e.ton||0),0);

function Mantenimiento({mant,setMant,user,hlId}){
  const[fB,setFB]=useState("Todos");const[fE,setFE]=useState("Todos");
  const[form,setForm]=useState({barco:"Taruma",eq:"",tarea:"",frec:"",u:"hs",uF:"",uHs:""});
  const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");
  const hlRef=useRef(null);
  useEffect(()=>{if(hlId&&hlRef.current){setTimeout(()=>{if(hlRef.current)hlRef.current.scrollIntoView({behavior:"smooth",block:"center"});},200);}},[hlId]);
  const hA={"Taruma":5413,"Taruma II":5168,"Taruma III":147};
  const venc=mant.filter(m=>m.est==="vencido").length;
  const canEdit=["gerente","jefemaquina"].includes(user.role);
  const resolver=async(m)=>{
    const newEst=m.est==="vencido"?"ok":"vencido";
    try{await atUpdate("Mantenimiento",m._id,{Estado:newEst});setMant(prev=>prev.map(x=>x.id===m.id?{...x,est:newEst}:x));}
    catch(e){alert("Error al actualizar: "+e.message);}
  };
  const filt=mant.filter(m=>(fB==="Todos"||m.barco===fB)&&(fE==="Todos"||m.est===fE));
  const submit=async()=>{
    if(!form.eq||!form.tarea||saving)return;
    setSaving(true);setErrMsg("");
    const h=hA[form.barco]||0;const p=form.frec&&form.uHs?Number(form.uHs)+Number(form.frec):null;
    const nuevo={barco:form.barco,eq:form.eq,tarea:form.tarea,frec:Number(form.frec)||null,u:form.u,uHs:Number(form.uHs)||null,uF:form.uF,pHs:p,est:p&&p<h?"vencido":"ok"};
    try{const rec=await atCreate("Mantenimiento",mappers.Mantenimiento.to(nuevo));setMant(prev=>[...prev,{...nuevo,_id:rec.id,id:rec.id}]);setForm({barco:"Taruma",eq:"",tarea:"",frec:"",u:"hs",uF:"",uHs:""});setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };
  const csv=()=>exportarCSV("mantenimiento",["Barco","Equipo","Tarea","Frec","Unidad","Última Fecha","Últ. Hs","Próximo Hs","Estado"],mant.map(m=>[m.barco,m.eq,m.tarea,m.frec||"",m.u,m.uF||"",m.uHs||"",m.pHs||"",m.est]));
  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Mantenimiento</div></div>
    <div className="ps">Plan de mantenimiento programado · Flota Taruma</div>

      <div className="kpi" style={{borderTop:"3px solid #16a34a"}}><div className="kl">Al Día</div><div className="kv">{mant.length-venc}</div></div>
    </div>
    {canEdit&&<div className="card">
      <CT>➕ Agregar Tarea</CT>{saved&&<Saved msg="✓ Tarea guardada"/>}<ErrMsg msg={errMsg}/>
      <div className="form">
        <div className="r3">
          <div><label className="lbl">Embarcación</label><select value={form.barco} onChange={e=>setForm({...form,barco:e.target.value})}>{["Taruma","Taruma II","Taruma III","Lancha"].map(b=><option key={b}>{b}</option>)}</select></div>
          <div><label className="lbl">Equipo</label><input value={form.eq} onChange={e=>setForm({...form,eq:e.target.value})} placeholder="Motor Principal..."/></div>
          <div><label className="lbl">Tarea</label><input value={form.tarea} onChange={e=>setForm({...form,tarea:e.target.value})} placeholder="Cambio de aceite..."/></div>
        </div>
        <div className="r4">
          <div><label className="lbl">Frecuencia</label><input type="number" value={form.frec} onChange={e=>setForm({...form,frec:e.target.value})} placeholder="250..."/></div>
          <div><label className="lbl">Unidad</label><select value={form.u} onChange={e=>setForm({...form,u:e.target.value})}><option value="hs">Horas</option><option value="mes">Meses</option></select></div>
          <div><label className="lbl">Última Fecha</label><input type="date" value={form.uF} onChange={e=>setForm({...form,uF:e.target.value})}/></div>
          <div><label className="lbl">Horas Últ. Mant.</label><input type="number" value={form.uHs} onChange={e=>setForm({...form,uHs:e.target.value})} placeholder="4178"/></div>
        </div>
        <div><button className="btn btn-p" onClick={submit} disabled={saving}>{saving?"Guardando...":"Agregar"}</button></div>
      </div>

// ── Incidentes ─────────────────────────────────────────────────────────────────
function Incidentes({inc,setInc,user,hlId}){
  const iF={fRep:"",por:user.name,a:"",fInc:"",hora:"",ub:"",op:"",parte:"",clas:"Operacional",cond:"Operativo",hPar:"",derrame:false,les:false,desc:"",causa:"",accion:"",test:""};
  const[form,setForm]=useState(iF);const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");const[exp,setExp]=useState(null);
  const hlRef=useRef(null);
  useEffect(()=>{if(hlId){setExp(hlId);setTimeout(()=>{if(hlRef.current)hlRef.current.scrollIntoView({behavior:"smooth",block:"center"});},200);}},[hlId]);
  const sevC={Operacional:"#A11C27",Seguridad:"#A11C27",Ambiental:"#d97706","Daño material":"#d97706"};
  const clases=["Operacional","Seguridad","Ambiental","Daño material"];
  const submit=async()=>{
    if(!form.fInc||!form.desc||saving)return;
    setSaving(true);setErrMsg("");
    const nro="INC-"+new Date().getFullYear()+"-"+String(inc.length+1).padStart(3,"0");
    const nuevo={...form,nro,hPar:Number(form.hPar)||0,est:"Abierto"};
    try{const rec=await atCreate("Incidentes",mappers.Incidentes.to(nuevo));setInc(prev=>[{...nuevo,_id:rec.id,id:rec.id},...prev]);setForm(iF);setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };
  const cerrar=async(i)=>{
    const newEst=i.est==="Cerrado"?"En revisión":"Cerrado";
    try{await atUpdate("Incidentes",i._id,{Estado:newEst});setInc(prev=>prev.map(x=>x.id===i.id?{...x,est:newEst}:x));}
    catch(e){alert("Error: "+e.message);}
  };
  const pdfInc=i=>exportarPDF("REPORTE DE INCIDENTE — DRAGA TARUMA",i.nro,i.fRep,[
    {titulo:"IDENTIFICACIÓN",tipo:"campos",campos:[["N° Reporte",i.nro],["Fecha Reporte",i.fRep],["Reportado Por",i.por],["Reportado A",i.a]]},
    {titulo:"INFORMACIÓN DEL EVENTO",tipo:"campos",campos:[["Fecha",i.fInc],["Hora",i.hora],["Ubicación",i.ub],["Operación",i.op],["Parte del Buque",i.parte],["Clasificación",i.clas]]},
    {titulo:"IMPACTO",tipo:"campos",campos:[["Condición Operativa",i.cond],["Horas Parada",i.hPar+" hs"],["¿Derrame?",i.derrame?"Sí":"No"],["¿Lesionados?",i.les?"Sí":"No"]]},
    {titulo:"DESCRIPCIÓN",tipo:"texto",contenido:i.desc},
    {titulo:"CAUSA RAÍZ",tipo:"texto",contenido:i.causa},
    {titulo:"ACCIÓN CORRECTIVA",tipo:"texto",contenido:i.accion},
    {titulo:"TESTIGOS",tipo:"texto",contenido:i.test},
  ],{nombre:i.por,cargo:user.cargo});

  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Incidentes</div></div>
    <div className="ps">Reporte y seguimiento — Draga Taruma</div>
    <div className="g4">
      <div className="kpi" style={{borderTop:"3px solid "+(inc.filter(i=>i.est!=="Cerrado").length>0?"#A11C27":"#16a34a")}}><div className="kl">Abiertos</div><div className="kv">{inc.filter(i=>i.est!=="Cerrado").length}</div></div>
      {clases.map(c=><div key={c} className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">{c}</div><div className="kv">{inc.filter(i=>i.clas===c).length}</div></div>)}
    </div>
    <div className="card">
      <CT>➕ Reportar Incidente</CT>{saved&&<Saved msg="✓ Incidente guardado"/>}<ErrMsg msg={errMsg}/>
      <div className="form">
        <div className="r3">
          <div><label className="lbl">Fecha Reporte</label><input type="date" value={form.fRep} onChange={e=>setForm({...form,fRep:e.target.value})}/></div>
          <div><label className="lbl">Reportado Por</label><input value={form.por} onChange={e=>setForm({...form,por:e.target.value})}/></div>
          <div><label className="lbl">Reportado A</label><input value={form.a} onChange={e=>setForm({...form,a:e.target.value})} placeholder="Capitán / Gerencia..."/></div>
        </div>
        <div className="r4">
          <div><label className="lbl">Fecha Incidente</label><input type="date" value={form.fInc} onChange={e=>setForm({...form,fInc:e.target.value})}/></div>
          <div><label className="lbl">Hora</label><input type="time" value={form.hora} onChange={e=>setForm({...form,hora:e.target.value})}/></div>
          <div><label className="lbl">Clasificación</label><select value={form.clas} onChange={e=>setForm({...form,clas:e.target.value})}>{clases.map(c=><option key={c}>{c}</option>)}</select></div>
          <div><label className="lbl">Cond. Operativa</label><select value={form.cond} onChange={e=>setForm({...form,cond:e.target.value})}>{["Operativo","Parada parcial","Parada total"].map(o=><option key={o}>{o}</option>)}</select></div>
        </div>
        <div className="r3">
          <div><label className="lbl">Ubicación</label><input value={form.ub} onChange={e=>setForm({...form,ub:e.target.value})} placeholder="Cubierta..."/></div>
          <div><label className="lbl">Operación</label><input value={form.op} onChange={e=>setForm({...form,op:e.target.value})} placeholder="Dragado..."/></div>
          <div><label className="lbl">Parte del Buque</label><input value={form.parte} onChange={e=>setForm({...form,parte:e.target.value})}/></div>
        </div>
        <div className="r3">
          <div><label className="lbl">Horas Parada</label><input type="number" step="0.25" value={form.hPar} onChange={e=>setForm({...form,hPar:e.target.value})} placeholder="0"/></div>
          <div style={{display:"flex",alignItems:"center",gap:18,paddingTop:18}}>
            <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer"}}><input type="checkbox" checked={form.derrame} onChange={e=>setForm({...form,derrame:e.target.checked})}/> ¿Derrame?</label>
            <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer"}}><input type="checkbox" checked={form.les} onChange={e=>setForm({...form,les:e.target.checked})}/> ¿Lesionados?</label>
          </div>
          <div><label className="lbl">Testigos</label><input value={form.test} onChange={e=>setForm({...form,test:e.target.value})}/></div>
        </div>
        <div><label className="lbl">Descripción del Evento</label><textarea value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})} placeholder="Qué ocurrió, cómo y dónde..."/></div>
        <div><label className="lbl">Causa Raíz</label><textarea value={form.causa} onChange={e=>setForm({...form,causa:e.target.value})} style={{minHeight:55}}/></div>
        <div><label className="lbl">Acción Correctiva</label><textarea value={form.accion} onChange={e=>setForm({...form,accion:e.target.value})} style={{minHeight:55}}/></div>
        <div><button className="btn btn-p" onClick={submit} disabled={saving}>{saving?"Guardando...":"Reportar Incidente"}</button></div>
      </div>
    </div>
    {inc.map((i,idx)=>{
      const sv=sevC[i.clas]||"#8a8aaa";const isHL=i.id===hlId;const isO=exp===i.id;
      return <div key={i._id||idx} ref={isHL?hlRef:null} className="card" style={{cursor:"pointer",borderLeft:"4px solid "+sv,...(isHL?{borderColor:"#d97706",background:"rgba(217,119,6,.03)"}:{})}} onClick={()=>setExp(isO?null:i.id)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:5,flexWrap:"wrap"}}>
              <span className="badge" style={{background:sv+"18",color:sv,border:"1px solid "+sv+"35"}}>{i.clas.toUpperCase()}</span>
              <span className="badge badge-m">{i.nro}</span>
              <span className={"badge "+(i.est==="Cerrado"?"badge-g":"badge-a")}>{i.est}</span>
              {isHL&&<span className="badge badge-a" style={{fontSize:9}}>← DESDE ALERTA</span>}
            </div>
            <div style={{fontWeight:700,marginBottom:3}}>{i.fInc} {i.hora&&"· "+i.hora}</div>
            <div style={{fontSize:12,color:"#8a8aaa"}}>{i.desc.slice(0,100)}{i.desc.length>100?"...":""}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:12}}>
            <button className="btn-pdf" onClick={e=>{e.stopPropagation();pdfInc(i);}}>📄 PDF</button>
            <div style={{color:"#8a8aaa",fontSize:18}}>{isO?"▲":"▼"}</div>
          </div>
        </div>
        {isO&&<div style={{marginTop:14}}>
          <div className="divider"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginTop:11}}>
            {[["Descripción",i.desc],["Causa Raíz",i.causa],["Acción Correctiva",i.accion],["Testigos",i.test]].map(([t,v])=>v&&
              <div key={t}><div style={{fontSize:10,color:"#8a8aaa",letterSpacing:"1px",marginBottom:3,fontWeight:700,textTransform:"uppercase"}}>{t}</div><div style={{fontSize:13}}>{v}</div></div>
            )}
          </div>
          <div style={{marginTop:12}}>
            <button className="btn" style={{background:i.est==="Cerrado"?"#fff":"#313280",color:i.est==="Cerrado"?"#4a4a6a":"#fff",border:"1px solid #E2E4EA",fontSize:12,padding:"7px 15px",borderRadius:9}} onClick={e=>{e.stopPropagation();cerrar(i);}}>{i.est==="Cerrado"?"↩ Reabrir":"✓ Cerrar incidente"}</button>
            {user.role==="gerente"&&<button className="btn btn-s" style={{background:"#fff",color:"#A11C27",border:"1px solid rgba(161,28,39,.3)",fontSize:12,padding:"7px 15px",borderRadius:9,marginLeft:8}} onClick={e=>{e.stopPropagation();if(!window.confirm("¿Borrar este incidente permanentemente?"))return;atDelete("Incidentes",i._id).then(()=>setInc(prev=>prev.filter(x=>x._id!==i._id))).catch(err=>alert("Error: "+err.message));}}>🗑 Borrar</button>}
          </div>
        </div>}
      </div>;
    })}
    {!inc.length&&<div style={{textAlign:"center",color:"#8a8aaa",padding:40}}>Sin incidentes registrados</div>}
  </div>;
}

// ── Combustible ────────────────────────────────────────────────────────────────
function Combustible({comb,setComb,user}){
  const[form,setForm]=useState({fecha:"",tipo:"Consumo",c24h:"",total:"",obs:""});const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");
  const canEdit=["gerente","capitan","jefemaquina"].includes(user.role);
  const ult=comb.length?comb[comb.length-1]:null;const nL=ult?ult.total:0;const CAP=getCapacidadCombustible();const pct=Math.min(Math.round((nL/CAP)*100),100);
  const prom=Math.round(comb.filter(c=>c.c24h>0).reduce((s,c)=>s+c.c24h,0)/Math.max(comb.filter(c=>c.c24h>0).length,1));
  const colN=pct>50?"#16a34a":pct>25?"#d97706":"#A11C27";
  const submit=async()=>{
    if(!form.fecha||!form.total||saving)return;
    setSaving(true);setErrMsg("");
    const nuevo={fecha:form.fecha,tipo:form.tipo,c24h:Number(form.c24h)||0,total:Number(form.total),obs:form.obs};
    try{const rec=await atCreate("Combustible",mappers.Combustible.to(nuevo));setComb(prev=>[...prev,{...nuevo,_id:rec.id,id:rec.id}]);setForm({fecha:"",tipo:"Consumo",c24h:"",total:"",obs:""});setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };
  const csv=()=>exportarCSV("combustible",["Fecha","Tipo","Consumo 24h (L)","Total (L)","Obs."],comb.map(c=>[c.fecha,c.tipo,c.c24h,c.total,c.obs]));
  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Combustible</div></div>
    <div className="ps">Control de combustible · Draga Taruma</div>
    {pct<30&&<div className="warn-b">⚠ Nivel bajo ({pct}%). Programar carga de combustible.</div>}
    <div className="g4">
      <div className="kpi" style={{borderTop:"3px solid "+colN}}><div className="kl">Total a Bordo</div><div className="kv">{nL.toLocaleString()}<span className="ku">L</span></div><div className={pct>30?"kok":"knok"}>~{pct}% · {CAP.toLocaleString()} L total</div></div>
      <div className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">Último Consumo</div><div className="kv">{(ult?ult.c24h:0).toLocaleString()}<span className="ku">L</span></div></div>
      <div className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">Promedio/día</div><div className="kv">{prom.toLocaleString()}<span className="ku">L</span></div></div>
      <div className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">Autonomía Est.</div><div className="kv">{prom>0?Math.round(nL/prom):0}<span className="ku">días</span></div></div>
    </div>
    {canEdit&&<div className="card">
      <CT>➕ Registrar Movimiento</CT>{saved&&<Saved/>}<ErrMsg msg={errMsg}/>
      <div className="form">
        <div className="r4">
          <div><label className="lbl">Fecha</label><input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/></div>
          <div><label className="lbl">Tipo</label><select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})}><option>Consumo</option><option>Carga</option></select></div>
          <div><label className="lbl">Consumo 24h (L)</label><input type="number" value={form.c24h} onChange={e=>setForm({...form,c24h:e.target.value})} placeholder="0"/></div>
          <div><label className="lbl">Total a Bordo (L)</label><input type="number" value={form.total} onChange={e=>setForm({...form,total:e.target.value})} placeholder="0"/></div>
        </div>
        <div><label className="lbl">Observaciones</label><input value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/></div>
        <div><button className="btn btn-p" onClick={submit} disabled={saving}>{saving?"Guardando...":"Registrar"}</button></div>
      </div>
    </div>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><CT>📋 Historial</CT><button className="btn-xls" onClick={csv}>📊 CSV</button></div>
      <table><thead><tr><th>Fecha</th><th>Tipo</th><th>Consumo 24h</th><th>Total a Bordo</th><th>Observaciones</th>{user.role==="gerente"&&<th></th>}</tr></thead>
        <tbody>{[...comb].reverse().map((c,i)=><tr key={c._id||i}>
          <td className="m">{c.fecha}</td>
          <td><span className={"badge "+(c.tipo==="Carga"?"badge-g":"badge-a")}>{c.tipo}</span></td>
          <td style={{fontWeight:700,color:c.c24h>2500?"#A11C27":c.c24h>2000?"#d97706":"#1a1a2e"}}>{c.c24h.toLocaleString()} L</td>
          <td style={{fontWeight:700,color:"#313280"}}>{c.total.toLocaleString()} L</td>
          <td className="m">{c.obs||"—"}</td>
        {user.role==="gerente"&&<td><button className="btn btn-s" style={{padding:"3px 8px",fontSize:11,color:"#A11C27",borderColor:"rgba(161,28,39,.3)"}} onClick={async()=>{if(!window.confirm("¿Borrar este registro de combustible?"))return;try{if(c._id)await atDelete("Combustible",c._id);setComb(prev=>prev.filter(x=>x._id!==c._id));}catch(err){alert("Error: "+err.message);}}}>✕</button></td>}
        </tr>)}
        {!comb.length&&<tr><td colSpan="6" style={{textAlign:"center",color:"#8a8aaa",padding:20}}>Sin registros</td></tr>}
        </tbody>
      </table>
    </div>
  </div>;
}

      <div className="ovfl">
        <table style={{minWidth:820}}><thead><tr><th>Fecha</th><th>RPM</th><th>C1</th><th>C2</th><th>C3</th><th>C4</th><th>C5</th><th>C6</th><th>Post T/C</th><th>HT In</th><th>HT Out</th><th>Lub.</th><th>Obs.</th>{user.role==="gerente"&&<th></th>}</tr></thead>

          </tr>)}

}

// ── Alarmas ────────────────────────────────────────────────────────────────────
function Alarmas({user,alarmas,setAlarmas}){
  const iRows=ALARMAS_C.map((c,i)=>({id:i+1,c,prob:false,aL:"",aP:"",est:"",obs:""}));
  const[rows,setRows]=useState(iRows);const[meta,setMeta]=useState({nro:"",fecha:"",hI:"",hF:"",inspector:user.name,cargo:user.cargo,prox:""});
  const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");
  const canEdit=["gerente","jefemaquina"].includes(user.role);
  const upRow=(id,f,v)=>setRows(prev=>prev.map(r=>r.id===id?{...r,[f]:v}:r));
  const fallas=rows.filter(r=>r.est==="Falla");
  const ult=alarmas.length?alarmas[alarmas.length-1]:null;const dV=ult?diasHasta(ult.prox):null;
  const guardar=async()=>{
    if(!meta.fecha||saving)return;
    setSaving(true);setErrMsg("");
    const nuevo={...meta,rows:[...rows],fallas:fallas.map(f=>f.c)};
    try{const rec=await atCreate("Alarmas",mappers.Alarmas.to(nuevo));setAlarmas(prev=>[...prev,{...nuevo,_id:rec.id,id:rec.id}]);setSaved(true);setTimeout(()=>setSaved(false),3000);setRows(iRows);setMeta({nro:"",fecha:"",hI:"",hF:"",inspector:user.name,cargo:user.cargo,prox:""});}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };
  const pdfAl=ins=>exportarPDF("REPORTE INSPECCIÓN ALARMAS DE SENTINA",ins.nro,ins.fecha,[
    {titulo:"DATOS DE LA INSPECCIÓN",tipo:"campos",campos:[["N° Reporte",ins.nro],["Fecha",ins.fecha],["Hora Inicio",ins.hI],["Hora Fin",ins.hF],["Inspector",ins.inspector],["Cargo",ins.cargo],["Próxima",ins.prox]]},
    {titulo:"CHECKLIST DE COMPARTIMIENTOS",tipo:"tabla",cols:["N°","Compartimiento","Probado","Alarma Local","Alarma Panel","Estado","Obs."],filas:(ins.rows||[]).map((r,i)=>[i+1,r.c,r.prob?"Sí":"No",r.aL||"—",r.aP||"—",r.est||"—",r.obs||"—"])},
    {titulo:"FALLAS DETECTADAS",tipo:"texto",contenido:(ins.fallas||[]).length?(ins.fallas||[]).join(", "):"Sin fallas."},
  ],{nombre:ins.inspector,cargo:ins.cargo});
  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Alarmas Sentina</div></div>
    <div className="ps">Inspección mensual de alarmas — Draga Taruma</div>
    <div className="g3">
      <div className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">Inspecciones</div><div className="kv">{alarmas.length}</div></div>
      <div className="kpi" style={{borderTop:"3px solid "+(dV!==null&&dV<=7?"#A11C27":"#16a34a")}}><div className="kl">Próxima Inspección</div><div className="kv" style={{fontSize:18}}>{ult?ult.prox:"—"}</div><div className={dV===null||dV>7?"kok":"knok"}>{dV!==null?"En "+dV+" días":"Sin programar"}</div></div>
      <div className="kpi" style={{borderTop:"3px solid "+(fallas.length?"#A11C27":"#16a34a")}}><div className="kl">Fallas Últ. Insp.</div><div className="kv">{ult&&ult.fallas?ult.fallas.length:0}</div></div>
    </div>
    {dV!==null&&dV<=7&&<div className="warn-b">⚠ Inspección de alarmas vence en {dV} días ({ult.prox}).</div>}
    {canEdit&&<div className="card">
      <CT>➕ Nueva Inspección</CT>{saved&&<Saved msg="✓ Inspección guardada"/>}<ErrMsg msg={errMsg}/>
      <div className="form">
        <div className="r4">
          <div><label className="lbl">N° Reporte</label><input value={meta.nro} onChange={e=>setMeta({...meta,nro:e.target.value})} placeholder="ALA-2026-002"/></div>
          <div><label className="lbl">Fecha</label><input type="date" value={meta.fecha} onChange={e=>setMeta({...meta,fecha:e.target.value})}/></div>
          <div><label className="lbl">Hora Inicio</label><input type="time" value={meta.hI} onChange={e=>setMeta({...meta,hI:e.target.value})}/></div>
          <div><label className="lbl">Hora Fin</label><input type="time" value={meta.hF} onChange={e=>setMeta({...meta,hF:e.target.value})}/></div>
        </div>
        <div className="r3">
          <div><label className="lbl">Inspector</label><input value={meta.inspector} onChange={e=>setMeta({...meta,inspector:e.target.value})}/></div>
          <div><label className="lbl">Cargo</label><input value={meta.cargo} onChange={e=>setMeta({...meta,cargo:e.target.value})}/></div>
          <div><label className="lbl">Próxima Inspección</label><input type="date" value={meta.prox} onChange={e=>setMeta({...meta,prox:e.target.value})}/></div>
        </div>
        {fallas.length>0&&<div className="warn-b">⚠ {fallas.length} falla(s): {fallas.map(f=>f.c).join(", ")}</div>}
        <table><thead><tr><th>N°</th><th>Compartimiento</th><th>Probado</th><th>Alarma Local</th><th>Alarma Panel</th><th>Estado</th><th>Obs.</th></tr></thead>
          <tbody>{rows.map(r=><tr key={r.id} style={{background:r.est==="Falla"?"rgba(161,28,39,.04)":"transparent"}}>
            <td className="m">{r.id}</td>
            <td style={{fontSize:12,fontWeight:500}}>{r.c}</td>
            <td><input type="checkbox" checked={r.prob} onChange={e=>upRow(r.id,"prob",e.target.checked)}/></td>
            {["aL","aP"].map(f=><td key={f}><select style={{padding:"5px 8px",fontSize:11,width:90}} value={r[f]} onChange={e=>upRow(r.id,f,e.target.value)}><option value="">—</option><option value="OK">OK</option><option value="Falla">Falla</option></select></td>)}
            <td><select style={{padding:"5px 8px",fontSize:11,width:95}} value={r.est} onChange={e=>upRow(r.id,"est",e.target.value)}><option value="">—</option><option value="OK">OK</option><option value="Falla">Falla</option><option value="N/A">N/A</option></select></td>
            <td><input style={{padding:"5px 8px",fontSize:11}} value={r.obs} onChange={e=>upRow(r.id,"obs",e.target.value)} placeholder="Obs..."/></td>
          </tr>)}</tbody>
        </table>
        <div><button className="btn btn-p" onClick={guardar} disabled={saving}>{saving?"Guardando...":"Guardar Inspección"}</button></div>
      </div>
    </div>}
    <div className="card">
      <CT>📋 Historial de Inspecciones</CT>
      {!alarmas.length&&<div style={{fontSize:13,color:"#8a8aaa",textAlign:"center",padding:20}}>Sin inspecciones registradas</div>}
      {[...alarmas].reverse().map((ins,i)=><div key={ins._id||i} style={{padding:"12px 0",borderBottom:"1px solid rgba(226,228,234,.4)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontWeight:700,marginBottom:2}}>{ins.nro} · {ins.fecha}</div><div style={{fontSize:12,color:"#8a8aaa"}}>Inspector: {ins.inspector} · Fallas: {ins.fallas?ins.fallas.length:0} · Próxima: {ins.prox}</div></div>
        <div style={{display:"flex",gap:8}}>
          {ins.fallas&&ins.fallas.length>0&&<span className="badge badge-r">FALLA</span>}
          <button className="btn-pdf" onClick={()=>pdfAl(ins)}>📄 PDF</button>
        </div>
      </div>)}
    </div>
  </div>;
}

// ── Inventario ─────────────────────────────────────────────────────────────────
function Inventario({inv,setInv,user,hlId}){
  const[sala,setSala]=useState("Todos");const[bus,setBus]=useState("");const[showF,setShowF]=useState(false);
  const[form,setForm]=useState({sala:"SALA DE FILTROS",sec:"",desc:"",cant:"",min:""});
  const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");
  const hlRef=useRef(null);
  useEffect(()=>{if(hlId&&hlRef.current){setTimeout(()=>{if(hlRef.current)hlRef.current.scrollIntoView({behavior:"smooth",block:"center"});},200);}},[hlId]);
  const canEdit=["gerente","jefemaquina"].includes(user.role);
  const salas=[...new Set(inv.map(i=>i.sala))];
  const pedidos=inv.filter(i=>i.cant<i.min&&i.min>0);
  const filt=inv.filter(i=>(sala==="Todos"||i.sala===sala)&&(!bus||i.desc.toLowerCase().includes(bus.toLowerCase())||i.sec.toLowerCase().includes(bus.toLowerCase())));
  const upCant=async(item,v)=>{
    const n=Math.max(0,Number(v));
    setInv(prev=>prev.map(i=>i.id===item.id?{...i,cant:n}:i));
    try{await atUpdate("Inventario",item._id,{Cant:n});}catch(e){console.error(e);}
  };
  const upMin=async(item,v)=>{
    const n=Math.max(0,Number(v));
    setInv(prev=>prev.map(i=>i.id===item.id?{...i,min:n}:i));
    try{await atUpdate("Inventario",item._id,{Min:n});}catch(e){console.error(e);}
  };
  const submit=async()=>{
    if(!form.desc||saving)return;
    setSaving(true);setErrMsg("");
    const nuevo={sala:form.sala,sec:form.sec,desc:form.desc,cant:Number(form.cant)||0,min:Number(form.min)||0};
    try{const rec=await atCreate("Inventario",mappers.Inventario.to(nuevo));setInv(prev=>[...prev,{...nuevo,_id:rec.id,id:rec.id}]);setForm({sala:"SALA DE FILTROS",sec:"",desc:"",cant:"",min:""});setShowF(false);setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };
  const csv=()=>exportarCSV("inventario",["Sala","Sector","Descripción","Cant. Actual","Cant. Mínima","Estado"],inv.map(i=>[i.sala,i.sec,i.desc,i.cant,i.min,i.cant<i.min&&i.min>0?"PEDIDO":"OK"]));
  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Inventario</div></div>
    <div className="ps">Stock de repuestos · Draga Taruma · {inv.length} ítems</div>
    {pedidos.length>0&&<div className="warn-b">⚠ {pedidos.length} ítem(s) bajo mínimo: {pedidos.slice(0,3).map(i=>i.desc.slice(0,25)).join(", ")}{pedidos.length>3?"...":""}</div>}
    <div className="g3">
      <div className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">Total Ítems</div><div className="kv">{inv.length}</div></div>
      <div className="kpi" style={{borderTop:"3px solid "+(pedidos.length?"#A11C27":"#16a34a")}}><div className="kl">Pedidos Urgentes</div><div className="kv">{pedidos.length}</div><div className={pedidos.length===0?"kok":"knok"}>{pedidos.length?"Stock bajo mínimo":"Inventario OK"}</div></div>
      <div className="kpi" style={{borderTop:"3px solid #16a34a"}}><div className="kl">Stock OK</div><div className="kv">{inv.length-pedidos.length}</div></div>
    </div>
    <div style={{display:"flex",gap:9,marginBottom:13,alignItems:"center",flexWrap:"wrap"}}>
      <input style={{flex:1,minWidth:180,padding:"9px 12px"}} value={bus} onChange={e=>setBus(e.target.value)} placeholder="Buscar ítem, código..."/>
      <select style={{width:190,padding:"9px 12px"}} value={sala} onChange={e=>setSala(e.target.value)}><option value="Todos">Todas las salas</option>{salas.map(s=><option key={s}>{s}</option>)}</select>
      {canEdit&&<button className="btn btn-p" style={{padding:"9px 15px"}} onClick={()=>setShowF(!showF)}>+ Ítem</button>}
      <button className="btn-xls" onClick={csv}>📊 CSV</button>
    </div>
    {showF&&canEdit&&<div className="card">
      <CT>➕ Nuevo Ítem</CT>{saved&&<Saved msg="✓ Ítem guardado"/>}<ErrMsg msg={errMsg}/>
      <div className="form">
        <div className="r3">
          <div><label className="lbl">Sala</label><select value={form.sala} onChange={e=>setForm({...form,sala:e.target.value})}>{salas.map(s=><option key={s}>{s}</option>)}</select></div>
          <div><label className="lbl">Sector</label><input value={form.sec} onChange={e=>setForm({...form,sec:e.target.value})} placeholder="GAB. 1, ESTANTE 2..."/></div>
          <div><label className="lbl">Descripción</label><input value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})} placeholder="Nombre y código..."/></div>
        </div>
        <div className="r2">
          <div><label className="lbl">Cantidad Actual</label><input type="number" value={form.cant} onChange={e=>setForm({...form,cant:e.target.value})} placeholder="0"/></div>
          <div><label className="lbl">Cantidad Mínima</label><input type="number" value={form.min} onChange={e=>setForm({...form,min:e.target.value})} placeholder="0"/></div>
        </div>
        <div style={{display:"flex",gap:9}}><button className="btn btn-p" onClick={submit} disabled={saving}>{saving?"Guardando...":"Agregar"}</button><button className="btn btn-s" onClick={()=>setShowF(false)}>Cancelar</button></div>
      </div>
    </div>}
    {salas.filter(s=>sala==="Todos"||s===sala).map(sl=>{
      const items=filt.filter(i=>i.sala===sl);if(!items.length)return null;
      const pedSala=items.filter(i=>i.cant<i.min&&i.min>0).length;
      return <div key={sl} className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div className="ct"><div className="cta"/>{sl}{pedSala>0&&<span className="badge badge-r" style={{marginLeft:7,fontSize:9}}>{pedSala} PEDIDO{pedSala>1?"S":""}</span>}</div>
          <span style={{fontSize:11,color:"#8a8aaa"}}>{items.length} ítems</span>
        </div>
        <table><thead><tr><th>Sector</th><th>Descripción</th><th>Actual</th><th>Mínimo</th><th>Alerta</th>{canEdit&&<th>Ajustar</th>}</tr></thead>
          <tbody>{items.map((i,idx)=>{
            const bajo=i.min>0&&i.cant<i.min;const isHL=i.id===hlId;
            return <tr key={i._id||idx} ref={isHL?hlRef:null} style={{background:isHL?"rgba(217,119,6,.08)":bajo?"rgba(161,28,39,.04)":"transparent"}}>
              <td className="m">{i.sec||"—"}</td>
              <td style={{fontSize:12,fontWeight:bajo?700:400,color:bajo?"#A11C27":"#1a1a2e"}}>{i.desc}{isHL&&<span className="badge badge-a" style={{marginLeft:7,fontSize:9}}>← ALERTA</span>}</td>
              <td style={{fontWeight:800,fontSize:15,color:bajo?"#A11C27":"#16a34a"}}>{i.cant}</td>
              <td className="m">{i.min>0?i.min:"—"}</td>
              <td>{bajo?<span className="badge badge-r">PEDIDO</span>:i.min>0?<span className="badge badge-g">OK</span>:<span className="badge badge-m">S/Min</span>}</td>
              {canEdit&&<td>
                <div style={{display:"flex",gap:4,alignItems:"center"}}>
                  <button className="btn btn-s" style={{padding:"3px 7px",fontSize:12}} onClick={()=>upCant(i,i.cant-1)}>−</button>
                  <span style={{fontWeight:700,minWidth:22,textAlign:"center"}}>{i.cant}</span>
                  <button className="btn btn-s" style={{padding:"3px 7px",fontSize:12}} onClick={()=>upCant(i,i.cant+1)}>+</button>
                  <input type="number" style={{width:45,padding:"4px 6px",fontSize:11}} placeholder="min" defaultValue={i.min} onBlur={e=>upMin(i,e.target.value)}/>
                  <button className="btn btn-s" style={{padding:"3px 7px",fontSize:11,color:"#A11C27",borderColor:"rgba(161,28,39,.3)",marginLeft:4}} onClick={async()=>{if(!window.confirm("¿Borrar este ítem del inventario?"))return;try{if(i._id)await atDelete("Inventario",i._id);setInv(prev=>prev.filter(x=>x._id!==i._id));}catch(err){alert("Error: "+err.message);}}}>✕</button>
                </div>
              </td>}
            </tr>;
          })}</tbody>
        </table>
      </div>;
    })}
  </div>;
}

// ── Reuniones ──────────────────────────────────────────────────────────────────
function Reuniones({reu,setReu,user}){

      <div className="form">

        <div><label className="lbl">Responsables</label><input value={form.resp} onChange={e=>setForm({...form,resp:e.target.value})}/></div>
        <div><button className="btn btn-p" onClick={submit} disabled={saving}>{saving?"Guardando...":"Guardar Acta"}</button></div>
      </div>
    </div>
    {[...reu].reverse().map((r,i)=><div key={r._id||i} className="card" style={{cursor:"pointer"}} onClick={()=>setExp(exp===r.id?null:r.id)}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontWeight:700,marginBottom:2}}>Reunión — {r.fecha}</div><div style={{fontSize:12,color:"#8a8aaa"}}>{r.asist}</div></div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button className="btn-pdf" onClick={e=>{e.stopPropagation();pdfR(r);}}>📄 PDF</button>
          {user.role==="gerente"&&<button className="btn btn-s" style={{padding:"4px 9px",fontSize:11,color:"#A11C27",borderColor:"rgba(161,28,39,.3)"}} onClick={async e=>{e.stopPropagation();if(!window.confirm("¿Borrar esta acta?"))return;try{if(r._id)await atDelete("Reuniones",r._id);setReu(prev=>prev.filter(x=>x._id!==r._id));}catch(err){alert("Error: "+err.message);}}}>✕</button>}
          <div style={{color:"#8a8aaa",fontSize:18}}>{exp===r.id?"▲":"▼"}</div>
        </div>
      </div>
      {exp===r.id&&<div style={{marginTop:12}}>
        <div className="divider"/>
        {[["📌 Temas",r.temas],["✅ Acuerdos",r.acuerdos],["👤 Responsables",r.resp]].map(([t,v])=>v&&<div key={t} style={{marginBottom:9}}><div style={{fontSize:10,color:"#8a8aaa",fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",marginBottom:3}}>{t}</div><div style={{fontSize:13}}>{v}</div></div>)}

    </div>)}
    {!reu.length&&<div style={{textAlign:"center",color:"#8a8aaa",padding:40}}>Sin actas registradas</div>}

}

// ── Actas de Mando ─────────────────────────────────────────────────────────────
function Actas({user,actas,setActas}){
  const[tipo,setTipo]=useState("capitan");const[form,setForm]=useState({fecha:"",zona:"",sal:"",ent:"",obs:""});
  const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");
  const sisSal=["Bomba de Dragado","Motor Principal","Reductores","Generadores Auxiliares","Sistema Hidráulico","Sistema Eléctrico","Sistema de Refrigeración","Sistema de Combustible","Sistema de Lubricación","Compresores / Aire de Servicio"];
  const[sis,setSis]=useState(sisSal.map(s=>({s,est:"",obs:""})));
  const chkSal=["Sistema de Dragado Operativo","Bomba Principal","Propulsión Principal","Generadores Auxiliares","Sistema Hidráulico","Sistema Eléctrico","Instrumentación y GPS","Sistema de Comunicación","Stock de Repuestos Críticos","Documentación y Certificados"];
  const[chk,setChk]=useState(chkSal.map(s=>({s,est:"",obs:""})));
  const guardar=async()=>{
    if(!form.fecha||saving)return;
    setSaving(true);setErrMsg("");
    const nuevo={tipo,fecha:form.fecha,zona:form.zona,sal:form.sal,ent:form.ent,sistemas:sis,checklist:chk,obs:form.obs};
    try{const rec=await atCreate("ActasMando",mappers.ActasMando.to(nuevo));setActas(prev=>[...prev,{...nuevo,_id:rec.id,id:rec.id}]);setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };
  const pdfActa=()=>{
    const titulo=tipo==="capitan"?"ACTA DE ENTREGA DE MANDO — CAPITÁN":"ACTA DE ENTREGA DE MANDO — JEFE DE MÁQUINAS";
    exportarPDF(titulo,"",form.fecha,[
      {titulo:"DATOS GENERALES",tipo:"campos",campos:[["Fecha y Hora",form.fecha],["Zona de Operación",form.zona],[tipo==="capitan"?"Capitán Saliente":"J.M. Saliente",form.sal],[tipo==="capitan"?"Capitán Entrante":"J.M. Entrante",form.ent]]},
      {titulo:"ESTADO GENERAL DE SISTEMAS",tipo:"tabla",cols:["Sistema","Estado","Observaciones"],filas:sis.map(s=>[s.s,s.est||"—",s.obs||"—"])},
      ...(tipo==="capitan"?[{titulo:"CHECKLIST OPERATIVO",tipo:"tabla",cols:["Ítem","Estado","Obs."],filas:chk.map(c=>[c.s,c.est||"—",c.obs||"—"])}]:[]),
      {titulo:"OBSERVACIONES",tipo:"texto",contenido:form.obs},
    ],{nombre:form.sal,cargo:tipo==="capitan"?"Capitán Saliente":"J.M. Saliente"});
  };
  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Actas de Mando</div></div>
    <div className="ps">Entrega de mando — Draga Taruma</div>
    <div style={{display:"flex",gap:9,marginBottom:18}}>
      {[["capitan","Capitán"],["jefemaquina","Jefe de Máquinas"]].map(([k,lb])=>
        <button key={k} className="btn" style={{padding:"10px 18px",background:tipo===k?"#313280":"#fff",color:tipo===k?"#fff":"#4a4a6a",border:"1px solid #E2E4EA",borderRadius:9}} onClick={()=>setTipo(k)}>{lb}</button>
      )}
    </div>
    <div className="card">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><CT>{tipo==="capitan"?"Capitán":"Jefe de Máquinas"}</CT><button className="btn-pdf" onClick={pdfActa}>📄 Generar PDF</button></div>
      {saved&&<Saved msg="✓ Acta guardada"/>}<ErrMsg msg={errMsg}/>
      <div className="form">
        <div className="r2"><div><label className="lbl">Fecha y Hora</label><input type="datetime-local" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/></div><div><label className="lbl">Zona de Operación</label><input value={form.zona} onChange={e=>setForm({...form,zona:e.target.value})} placeholder="Río Bermejo, km 12..."/></div></div>
        <div className="r2"><div><label className="lbl">{tipo==="capitan"?"Capitán Saliente":"J.M. Saliente"}</label><input value={form.sal} onChange={e=>setForm({...form,sal:e.target.value})}/></div><div><label className="lbl">{tipo==="capitan"?"Capitán Entrante":"J.M. Entrante"}</label><input value={form.ent} onChange={e=>setForm({...form,ent:e.target.value})}/></div></div>
        <div className="divider"/>
        <div style={{fontSize:10,color:"#8a8aaa",fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",marginBottom:9}}>Estado General de Sistemas</div>
        <table><thead><tr><th>Sistema</th><th>Estado</th><th>Observaciones</th></tr></thead>
          <tbody>{sis.map((s,i)=><tr key={i}><td style={{fontSize:12,fontWeight:500}}>{s.s}</td><td><select style={{padding:"6px 10px",fontSize:12,width:175}} value={s.est} onChange={e=>setSis(prev=>prev.map((x,j)=>j===i?{...x,est:e.target.value}:x))}><option value="">—</option><option value="OK">OK</option><option value="Restricción">Restricción</option><option value="Fuera de Servicio">Fuera de Servicio</option></select></td><td><input style={{padding:"6px 10px",fontSize:12}} value={s.obs} onChange={e=>setSis(prev=>prev.map((x,j)=>j===i?{...x,obs:e.target.value}:x))} placeholder="Obs..."/></td></tr>)}</tbody>
        </table>
        {tipo==="capitan"&&<>
          <div className="divider"/>
          <div style={{fontSize:10,color:"#8a8aaa",fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",marginBottom:9}}>Checklist Operativo</div>
          <table><thead><tr><th>Ítem</th><th>Estado</th><th>Obs.</th></tr></thead>
            <tbody>{chk.map((c,i)=><tr key={i}><td style={{fontSize:12,fontWeight:500}}>{c.s}</td><td><select style={{padding:"6px 10px",fontSize:12,width:155}} value={c.est} onChange={e=>setChk(prev=>prev.map((x,j)=>j===i?{...x,est:e.target.value}:x))}><option value="">—</option><option value="OK">OK</option><option value="Observación">Observación</option></select></td><td><input style={{padding:"6px 10px",fontSize:12}} value={c.obs} onChange={e=>setChk(prev=>prev.map((x,j)=>j===i?{...x,obs:e.target.value}:x))} placeholder="..."/></td></tr>)}</tbody>
          </table>
        </>}
        <div><label className="lbl">Observaciones del Saliente</label><textarea value={form.obs} onChange={e=>setForm({...form,obs:e.target.value})}/></div>
        <div style={{display:"flex",gap:9}}>
          <button className="btn btn-p" onClick={guardar} disabled={saving}>{saving?"Guardando...":"Guardar Acta"}</button>
          <button className="btn-pdf" onClick={pdfActa}>📄 Generar PDF</button>
        </div>
      </div>
    </div>
  </div>;
}

// ── Usuarios ────────────────────────────────────────────────────────────────────
function Usuarios(){
  const ROLES_OPTIONS=[{v:"gerente",l:"Gerencia"},{v:"capitan",l:"Capitán"},{v:"oficial",l:"Oficial"},{v:"jefemaquina",l:"Jefe de Máquinas"}];
  const[users,setUsers]=useState(()=>getUsers());
  const[form,setForm]=useState({email:"",password:"",role:"capitan",name:"",cargo:""});
  const[saved,setSaved]=useState(false);const[errMsg,setErrMsg]=useState("");

  const addUser=()=>{
    if(!form.email||!form.password||!form.name)return setErrMsg("Email, nombre y contraseña son obligatorios.");
    if(form.email==="jschebela@ddp.com.py")return setErrMsg("No se puede modificar el usuario maestro.");
    const newUsers={...users,[form.email.toLowerCase()]:{password:form.password,role:form.role,name:form.name,cargo:form.cargo||ROLES_OPTIONS.find(r=>r.v===form.role)?.l}};
    saveUsers(newUsers);setUsers(getUsers());
    setForm({email:"",password:"",role:"capitan",name:"",cargo:""});
    setSaved(true);setTimeout(()=>setSaved(false),3000);setErrMsg("");
  };

  const deleteUser=email=>{
    if(email==="jschebela@ddp.com.py")return alert("No se puede borrar el usuario maestro.");
    if(!window.confirm("¿Eliminar el usuario "+email+"?"))return;
    const newUsers={...users};delete newUsers[email];
    saveUsers(newUsers);setUsers(getUsers());
  };

  const roleColor={gerente:"badge-n",capitan:"badge-r",oficial:"badge-a",jefemaquina:"badge-m"};

  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Gestión de Usuarios</div></div>
    <div className="ps">Crear y eliminar usuarios del sistema — Solo Gerencia</div>

    <div className="card">
      <CT>➕ Crear Nuevo Usuario</CT>
      {saved&&<Saved msg="✓ Usuario guardado"/>}
      {errMsg&&<ErrMsg msg={errMsg}/>}
      <div className="form">
        <div className="r2">
          <div><label className="lbl">Email (usuario de acceso)</label><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="usuario@ddp.com.py"/></div>
          <div><label className="lbl">Contraseña</label><input type="text" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="contraseña123"/></div>
        </div>
        <div className="r3">
          <div><label className="lbl">Nombre completo</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Nombre Apellido"/></div>
          <div><label className="lbl">Rol</label>
            <select value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
              {ROLES_OPTIONS.map(r=><option key={r.v} value={r.v}>{r.l}</option>)}
            </select>
          </div>
          <div><label className="lbl">Cargo (opcional)</label><input value={form.cargo} onChange={e=>setForm({...form,cargo:e.target.value})} placeholder="Capitán Taruma..."/></div>
        </div>
        <div><button className="btn btn-p" onClick={addUser}>Crear Usuario</button></div>
      </div>
    </div>

    <div className="card">
      <CT>👤 Usuarios Activos</CT>
      <table>
        <thead><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Cargo</th><th></th></tr></thead>
        <tbody>
          {Object.entries(users).map(([email,u])=><tr key={email}>
            <td style={{fontWeight:600,fontSize:12}}>{email}</td>
            <td>{u.name}</td>
            <td><span className={"badge "+(roleColor[u.role]||"badge-m")}>{u.role}</span></td>
            <td className="m">{u.cargo||"—"}</td>
            <td>{email!=="jschebela@ddp.com.py"
              ?<button className="btn btn-s" style={{padding:"4px 10px",fontSize:11,color:"#A11C27",borderColor:"rgba(161,28,39,.3)"}} onClick={()=>deleteUser(email)}>✕ Eliminar</button>
              :<span style={{fontSize:11,color:"#8a8aaa"}}>🔒 Maestro</span>}
            </td>
          </tr>)}
        </tbody>
      </table>
      <div style={{fontSize:11,color:"#8a8aaa",marginTop:10}}>
        Los usuarios se guardan localmente en este dispositivo. Para que funcionen en otro dispositivo, crearlos también desde allí.
      </div>
    </div>
  </div>;
}


// ── CapacidadConfig ─────────────────────────────────────────────────────────────
function CapacidadConfig(){
  const[cap,setCap]=useState(()=>getCapacidadCombustible());
  const[saved,setSaved]=useState(false);
  const save=()=>{
    if(!cap||cap<1000)return;
    setCapacidadCombustible(cap);
    setSaved(true);setTimeout(()=>setSaved(false),3000);
  };
  return <div>
    {saved&&<Saved msg="✓ Capacidad guardada"/>}
    <div className="r2">
      <div>
        <label className="lbl">Capacidad total del tanque (litros)</label>
        <input type="number" value={cap} onChange={e=>setCap(Number(e.target.value))} placeholder="75000" step="1000"/>
        <div style={{fontSize:11,color:"#8a8aaa",marginTop:5}}>Actualmente: {getCapacidadCombustible().toLocaleString()} L</div>
      </div>
      <div style={{display:"flex",alignItems:"flex-end"}}>
        <button className="btn btn-p" style={{width:"auto",padding:"10px 20px"}} onClick={save}>Guardar</button>
      </div>
    </div>
  </div>;
}


// ── Configuración ──────────────────────────────────────────────────────────────
function Config({turnos,setTurnos,tipos,setTipos}){
  const[nT,setNT]=useState({nombre:"",tri:""});const[nTipo,setNTipo]=useState("");const[st,setSt]=useState(false);const[se,setSe]=useState(false);
  const addT=()=>{if(!nT.nombre)return;setTurnos(prev=>[...prev,{id:Date.now(),nombre:nT.nombre,tripulacion:nT.tri}]);setNT({nombre:"",tri:""});setSt(true);setTimeout(()=>setSt(false),3000);};
  const addTipo=()=>{if(!nTipo||tipos.includes(nTipo))return;setTipos(prev=>[...prev,nTipo]);setNTipo("");setSe(true);setTimeout(()=>setSe(false),3000);};
  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Configuración</div></div>
    <div className="ps">Solo accesible para Gerencia</div>
    <div className="g2">
      <div className="card"><CT>⛽ Capacidad de Combustible</CT>
      <CapacidadConfig/>
    </div>
    <div className="card"><CT>👥 Turnos y Tripulación</CT>
        {st&&<Saved msg="✓ Turno agregado"/>}
        <div style={{display:"flex",gap:7,marginBottom:13}}>
          <input style={{flex:1}} value={nT.nombre} onChange={e=>setNT({...nT,nombre:e.target.value})} placeholder="Turno A..."/>
          <input style={{flex:2}} value={nT.tri} onChange={e=>setNT({...nT,tri:e.target.value})} placeholder="Vera / López"/>
          <button className="btn btn-p" style={{flexShrink:0,padding:"10px 13px"}} onClick={addT}>+</button>
        </div>
        <table><thead><tr><th>Turno</th><th>Tripulación</th><th></th></tr></thead>
          <tbody>{turnos.map(t=><tr key={t.id}><td style={{fontWeight:700}}>{t.nombre}</td><td className="m">{t.tripulacion}</td><td><button className="btn btn-s" style={{padding:"4px 9px",fontSize:11,color:"#A11C27",borderColor:"rgba(161,28,39,.3)"}} onClick={()=>setTurnos(prev=>prev.filter(x=>x.id!==t.id))}>✕</button></td></tr>)}</tbody>
        </table>
      </div>
      <div className="card"><CT>📋 Tipos de Evento</CT>
        {se&&<Saved msg="✓ Tipo agregado"/>}
        <div style={{display:"flex",gap:7,marginBottom:13}}><input style={{flex:1}} value={nTipo} onChange={e=>setNTipo(e.target.value)} placeholder="Nuevo tipo de evento..."/><button className="btn btn-p" style={{flexShrink:0,padding:"10px 13px"}} onClick={addTipo}>+</button></div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {tipos.map((t,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 11px",background:"#F4F5F7",borderRadius:7,border:"1px solid #E2E4EA"}}>
            <span style={{fontSize:12,fontWeight:500}}>{t}</span>
            <button style={{background:"none",border:"none",color:"rgba(161,28,39,.7)",cursor:"pointer",fontSize:13}} onClick={()=>setTipos(prev=>prev.filter(x=>x!==t))}>✕</button>
          </div>)}
        </div>
      </div>
    </div>
  </div>;
}

function Procedimientos({user}){
  const[busqueda,setBusqueda]=useState("");
  const[catActiva,setCatActiva]=useState("Todos");
  const[abierto,setAbierto]=useState(null);

  const cats=["Todos",...new Set(PROCS.map(p=>p.cat))];
  const visibles=user.role==="gerente"?PROCS:PROCS.filter(p=>p.roles.includes(user.role));
  const filtrados=visibles.filter(p=>{
    const catOk=catActiva==="Todos"||p.cat===catActiva;
    const busOk=!busqueda||p.titulo.toLowerCase().includes(busqueda.toLowerCase())||p.pasos.some(s=>s.toLowerCase().includes(busqueda.toLowerCase()));
    return catOk&&busOk;
  });

  const catColors={"Operación":"#313280","Técnico":"#6d28d9","Navegación":"#0369a1","Operaciones Generales":"#16a34a"};

  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Procedimientos</div></div>
    <div className="ps">Biblioteca de procedimientos operativos — Draga Taruma</div>

    <div style={{display:"flex",gap:9,marginBottom:18,flexWrap:"wrap",alignItems:"center"}}>
      <input style={{flex:1,minWidth:200,padding:"9px 13px"}} value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar procedimiento o palabra clave..."/>
      <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
        {cats.map(c=><button key={c} className="btn" style={{padding:"8px 14px",fontSize:12,background:catActiva===c?(catColors[c]||"#313280"):"#fff",color:catActiva===c?"#fff":"#4a4a6a",border:"1px solid #E2E4EA",borderRadius:8}} onClick={()=>setCatActiva(c)}>{c}</button>)}
      </div>
    </div>

    <div style={{fontSize:12,color:"#8a8aaa",marginBottom:14}}>{filtrados.length} procedimiento{filtrados.length!==1?"s":""} disponibles</div>

    {filtrados.map(p=>{
      const isOpen=abierto===p.id;
      const col=catColors[p.cat]||"#313280";
      return <div key={p.id} className="card" style={{cursor:"pointer",borderLeft:"4px solid "+col}} onClick={()=>setAbierto(isOpen?null:p.id)}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:isOpen?6:0,flexWrap:"wrap"}}>
              <span className="badge" style={{background:col+"18",color:col,border:"1px solid "+col+"35",fontSize:10}}>{p.cat}</span>
              <span style={{fontSize:14,fontWeight:700,color:"#1a1a2e"}}>{p.titulo}</span>
            </div>
            {!isOpen&&<div style={{fontSize:12,color:"#8a8aaa",marginTop:3}}>{p.pasos.length} pasos — click para ver</div>}
          </div>
          <div style={{color:"#8a8aaa",fontSize:18,marginLeft:12,flexShrink:0}}>{isOpen?"▲":"▼"}</div>
        </div>
        {isOpen&&<div style={{marginTop:14}}>
          <div className="divider"/>
          <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:0}}>
            {p.pasos.map((paso,i)=>{
              const isWarn=paso.startsWith("⚠");
              const isSection=paso.includes("—")&&paso.split("—")[0].length<25&&paso.split("—")[0].toUpperCase()===paso.split("—")[0];
              return <div key={i} style={{display:"flex",gap:12,padding:"9px 0",borderBottom:"1px solid rgba(226,228,234,.4)",background:isWarn?"rgba(217,119,6,.04)":"transparent",margin:"0 -4px",padding:"9px 4px"}}>
                <div style={{minWidth:24,height:24,borderRadius:"50%",background:isWarn?"#d97706":col,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,marginTop:1}}>{isWarn?"!":i+1}</div>
                <div style={{fontSize:13,color:isWarn?"#d97706":"#1a1a2e",fontWeight:isWarn||isSection?600:400,lineHeight:1.6}}>{paso}</div>
              </div>;
            })}
          </div>
        </div>}
      </div>;
    })}
    {!filtrados.length&&<div style={{textAlign:"center",color:"#8a8aaa",padding:40}}>Sin procedimientos que coincidan con la búsqueda</div>}
  </div>;
}

// Lookup con interpolación lineal si el valor exacto no está
function hopperLookup(table, ullage){
  const u=Math.max(0,Math.min(450,Math.round(ullage)));
  if(table[u]!==undefined&&table[u]!==null)return table[u];
  // interpolate
  let lo=u,hi=u;
  while(lo>=0&&(table[lo]===undefined||table[lo]===null))lo--;
  while(hi<=450&&(table[hi]===undefined||table[hi]===null))hi++;
  if(lo<0)return table[hi]||0;
  if(hi>450)return table[lo]||0;
  const t=(u-lo)/(hi-lo);
  return table[lo]+(table[hi]-table[lo])*t;
}

// Cálculo M³ por sondeo de bodega
// aftUllages: [pt11, pt9, pt7, pt12, pt10, pt8]
// foreUllages: [pt5, pt3, pt1, pt6, pt4, pt2]
function calcM3Bodega(aftUllages, foreUllages){
  const aft=[
    hopperLookup(HOPPER_AFT, aftUllages[0]-10), // pt11 (extremo popa PS)
    hopperLookup(HOPPER_AFT, aftUllages[1]),      // pt9
    hopperLookup(HOPPER_AFT, aftUllages[2]),      // pt7
    hopperLookup(HOPPER_AFT, aftUllages[3]-10), // pt12 (extremo popa SB)
    hopperLookup(HOPPER_AFT, aftUllages[4]),      // pt10
    hopperLookup(HOPPER_AFT, aftUllages[5]),      // pt8
  ];
  const fore=[
    hopperLookup(HOPPER_FORE, foreUllages[0]),      // pt5
    hopperLookup(HOPPER_FORE, foreUllages[1]),      // pt3
    hopperLookup(HOPPER_FORE, foreUllages[2]-10), // pt1 (extremo proa PS)
    hopperLookup(HOPPER_FORE, foreUllages[3]),      // pt6
    hopperLookup(HOPPER_FORE, foreUllages[4]),      // pt4
    hopperLookup(HOPPER_FORE, foreUllages[5]-10), // pt2 (extremo proa SB)
  ];
  const h2=aft.reduce((s,v)=>s+v,0)/6;
  const h1=fore.reduce((s,v)=>s+v,0)/6;
  return{h1:Math.round(h1*100)/100,h2:Math.round(h2*100)/100,total:Math.round((h1+h2)*100)/100};
}

// Cálculo M³ por rainbow
// duracion en horas (decimal)
function calcM3Rainbow(horasDecimal){
  return Math.round(horasDecimal*1000*0.14*100)/100;
}

function Tripulacion({tripulantes,setTripulantes,embarques,setEmbarques,francosUsados,setFrancosUsados,user}){
  const[vista,setVista]=useState("resumen");
  const[saved,setSaved]=useState(false);const[saving,setSaving]=useState(false);const[errMsg,setErrMsg]=useState("");
  const[showAddTrip,setShowAddTrip]=useState(false);
  const[showEmb,setShowEmb]=useState(false);
  const[showFranco,setShowFranco]=useState(false);
  const[formTrip,setFormTrip]=useState({idNum:"",nombre:"",cargo:"MARINERO",libreta:"",ingreso:""});
  const[formEmb,setFormEmb]=useState({idTrip:"",nombre:"",fEmb:"",fDes:"",tipo:"embarque"});
  const[formFranco,setFormFranco]=useState({idTrip:"",nombre:"",fecha:"",dias:"",obs:"",tipo:"franco"});

  const cargos=["CAPITAN","PATRON BAQUEANO","JEFE DE MAQUINAS","ENGRASADOR","MARINERO","COCINERO/A","CONTRAMAESTRE","OTRO"];

  // Calculate summary per crew member
  const resumen=tripulantes.map(t=>{
    const embs=embarques.filter(e=>e.idTrip===t.idNum);
    const totalDias=embs.reduce((s,e)=>s+e.dias,0);
    const totalFrancosGen=embs.reduce((s,e)=>s+e.francos,0);
    const totalFrancosUs=francosUsados.filter(f=>f.idTrip===t.idNum&&f.tipo!=="vacaciones").reduce((s,f)=>s+f.dias,0);
    const totalVacaciones=francosUsados.filter(f=>f.idTrip===t.idNum&&f.tipo==="vacaciones").reduce((s,f)=>s+f.dias,0);
    const saldo=totalFrancosGen-totalFrancosUs;
    const embActual=embs.find(e=>!e.fDes||e.fDes==="");
    const ultimoEmb=embs.sort((a,b)=>b.fEmb.localeCompare(a.fEmb))[0];
    // Estimate fin de franco: if on land, last disembark + saldo days
    let finFranco=null;
    if(!t.embarcado&&ultimoEmb&&ultimoEmb.fDes&&saldo>0){
      const d=new Date(ultimoEmb.fDes);d.setDate(d.getDate()+saldo);
      finFranco=d.toISOString().slice(0,10);
    }
    const diasEnTierra=(!t.embarcado&&ultimoEmb&&ultimoEmb.fDes)?Math.round((new Date()-new Date(ultimoEmb.fDes))/(1000*60*60*24)):0;
    return{...t,totalDias,totalFrancosGen,totalFrancosUs,saldo,totalVacaciones,embarcado:t.embarcado,ultimoEmb:ultimoEmb?ultimoEmb.fDes||ultimoEmb.fEmb:"",finFranco,diasEnTierra};
  });

  const embarcados=resumen.filter(t=>t.embarcado);
  const enTierra=resumen.filter(t=>!t.embarcado);
  const conSaldoNeg=resumen.filter(t=>t.saldo<0);
  const totalNegativo=Math.abs(conSaldoNeg.reduce((s,t)=>s+t.saldo,0));
  const totalSaldoPositivo=resumen.filter(t=>t.saldo>0).reduce((s,t)=>s+t.saldo,0);

  const addTrip=async()=>{
    if(!formTrip.nombre||!formTrip.idNum||saving)return;
    setSaving(true);setErrMsg("");
    const nuevo={idNum:Number(formTrip.idNum),nombre:formTrip.nombre.toUpperCase(),cargo:formTrip.cargo,libreta:Number(formTrip.libreta)||0,ingreso:formTrip.ingreso,embarcado:false};
    try{const r=await atCreate("Tripulantes",mapTrip.to(nuevo));setTripulantes(prev=>[...prev,{...nuevo,_id:r.id,id:r.id}]);setFormTrip({idNum:"",nombre:"",cargo:"MARINERO",libreta:"",ingreso:""});setShowAddTrip(false);setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };

  const registrarEmbarque=async()=>{
    if(!formEmb.idTrip||!formEmb.fEmb||saving)return;
    setSaving(true);setErrMsg("");
    const trip=tripulantes.find(t=>t._id===formEmb.idTrip);
    if(!trip){setErrMsg("Tripulante no encontrado");setSaving(false);return;}
    if(formEmb.tipo==="embarque"){
      // Update embarcado status
      try{
        await atUpdate("Tripulantes",trip._id,{Embarcado:true});
        setTripulantes(prev=>prev.map(t=>t._id===trip._id?{...t,embarcado:true}:t));
        // Create embarque record (no fDes yet)
        const nuevo={idTrip:trip.idNum,nombre:trip.nombre,fEmb:formEmb.fEmb,fDes:"",dias:0,francos:0};
        const r=await atCreate("Embarques",mapEmb.to(nuevo));
        setEmbarques(prev=>[{...nuevo,_id:r.id,id:r.id},...prev]);
        setSaved(true);setTimeout(()=>setSaved(false),3000);setFormEmb({idTrip:"",nombre:"",fEmb:"",fDes:"",tipo:"embarque"});setShowEmb(false);
      }catch(e){setErrMsg(e.message);}
    }else{
      // Desembarque - find open embarque and update it
      const embAbierto=embarques.find(e=>e.idTrip===trip.idNum&&(!e.fDes||e.fDes===""));
      if(!embAbierto){setErrMsg("No hay embarque abierto para este tripulante");setSaving(false);return;}
      try{
        const dias=Math.round((new Date(formEmb.fDes)-new Date(embAbierto.fEmb))/(1000*60*60*24));
        const francos=Math.floor(dias/3);
        await atUpdate("Embarques",embAbierto._id,{FechaDesembarque:formEmb.fDes,DiasTrabajos:dias,FrancosGenerados:francos});
        await atUpdate("Tripulantes",trip._id,{Embarcado:false});
        setEmbarques(prev=>prev.map(e=>e._id===embAbierto._id?{...e,fDes:formEmb.fDes,dias,francos}:e));
        setTripulantes(prev=>prev.map(t=>t._id===trip._id?{...t,embarcado:false}:t));
        setSaved(true);setTimeout(()=>setSaved(false),3000);setFormEmb({idTrip:"",nombre:"",fEmb:"",fDes:"",tipo:"embarque"});setShowEmb(false);
      }catch(e){setErrMsg(e.message);}
    }
    setSaving(false);
  };

  const registrarFranco=async()=>{
    if(!formFranco.idTrip||!formFranco.fecha||!formFranco.dias||saving)return;
    setSaving(true);setErrMsg("");
    const trip=tripulantes.find(t=>t._id===formFranco.idTrip);
    if(!trip){setErrMsg("Tripulante no encontrado");setSaving(false);return;}
    const nuevo={idTrip:trip.idNum,nombre:trip.nombre,fecha:formFranco.fecha,dias:Number(formFranco.dias),obs:formFranco.obs,tipo:formFranco.tipo};
    try{const r=await atCreate("FrancosUsados",mapFrancos.to(nuevo));setFrancosUsados(prev=>[{...nuevo,_id:r.id,id:r.id},...prev]);setFormFranco({idTrip:"",nombre:"",fecha:"",dias:"",obs:""});setShowFranco(false);setSaved(true);setTimeout(()=>setSaved(false),3000);}
    catch(e){setErrMsg(e.message);}setSaving(false);
  };

  const badgeColor=saldo=>saldo>10?"#16a34a":saldo>=0?"#d97706":"#A11C27";

  return <div>
    <div className="ph"><div className="ra"/><div className="pt">Control de Tripulación</div></div>
    <div className="ps">Solo visible para Gerencia — Draga Taruma</div>

    {/* KPIs */}
    <div className="g4">
      <div className="kpi" style={{borderTop:"3px solid #313280"}}><div className="kl">Total Tripulantes</div><div className="kv">{tripulantes.length}</div></div>
      <div className="kpi" style={{borderTop:"3px solid #16a34a"}}><div className="kl">Embarcados</div><div className="kv" style={{color:"#16a34a"}}>{embarcados.length}</div></div>
      <div className="kpi" style={{borderTop:"3px solid #d97706"}}><div className="kl">En Tierra</div><div className="kv" style={{color:"#d97706"}}>{enTierra.length}</div></div>

        <div className={conSaldoNeg.length?"knok":"kok"}>{conSaldoNeg.length?"tripulantes":"Ninguno"}</div>

    {/* Resumen de saldos */}

        <div className="kv" style={{color:"#16a34a"}}>{totalSaldoPositivo}<span className="ku">días</span></div>
