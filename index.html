      )}
      <div style={{marginLeft:"auto",display:"flex",gap:8}}>
        <button className="btn btn-p" style={{padding:"9px 14px",fontSize:12}} onClick={()=>setShowEmb(!showEmb)}>⚓ Registrar Mov.</button>
        <button className="btn btn-p" style={{padding:"9px 14px",fontSize:12}} onClick={()=>setShowFranco(!showFranco)}>📅 Registrar Franco</button>
        <button className="btn btn-p" style={{padding:"9px 14px",fontSize:12}} onClick={()=>setShowAddTrip(!showAddTrip)}>+ Tripulante</button>
      </div>
    </div>

    {saved&&<div className="ok-b">✓ Guardado en Airtable</div>}
    <ErrMsg msg={errMsg}/>

    {/* Form: Nuevo tripulante */}
    {showAddTrip&&<div className="card">
      <CT>➕ Nuevo Tripulante</CT>
      <div className="form">
        <div className="r3">
          <div><label className="lbl">N° Cédula</label><input type="number" value={formTrip.idNum} onChange={e=>setFormTrip({...formTrip,idNum:e.target.value})} placeholder="5911669"/></div>
          <div><label className="lbl">Nombre completo</label><input value={formTrip.nombre} onChange={e=>setFormTrip({...formTrip,nombre:e.target.value})} placeholder="APELLIDO NOMBRE"/></div>
          <div><label className="lbl">Cargo</label><select value={formTrip.cargo} onChange={e=>setFormTrip({...formTrip,cargo:e.target.value})}>{cargos.map(c=><option key={c}>{c}</option>)}</select></div>
        </div>
        <div className="r2">
          <div><label className="lbl">N° Libreta</label><input type="number" value={formTrip.libreta} onChange={e=>setFormTrip({...formTrip,libreta:e.target.value})} placeholder="21743"/></div>
          <div><label className="lbl">Fecha de Ingreso al Proyecto</label><input type="date" value={formTrip.ingreso} onChange={e=>setFormTrip({...formTrip,ingreso:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:9}}><button className="btn btn-p" onClick={addTrip} disabled={saving}>{saving?"Guardando...":"Agregar Tripulante"}</button><button className="btn btn-s" onClick={()=>setShowAddTrip(false)}>Cancelar</button></div>
      </div>
    </div>}

    {/* Form: Embarque / Desembarque */}
    {showEmb&&<div className="card">
      <CT>⚓ Registrar Movimiento</CT>
      <div className="form">
        <div className="r2">
          <div><label className="lbl">Tipo</label>
            <div style={{display:"flex",gap:8}}>
              {["embarque","desembarque"].map(t=><button key={t} className="btn" style={{flex:1,padding:"9px",background:formEmb.tipo===t?"#313280":"#fff",color:formEmb.tipo===t?"#fff":"#4a4a6a",border:"1px solid #E2E4EA",borderRadius:8,fontSize:12,textTransform:"capitalize"}} onClick={()=>setFormEmb({...formEmb,tipo:t})}>{t}</button>)}
            </div>
          </div>
          <div><label className="lbl">Tripulante</label>
            <select value={formEmb.idTrip} onChange={e=>setFormEmb({...formEmb,idTrip:e.target.value})}>
              <option value="">Seleccionar...</option>
              {tripulantes.filter(t=>formEmb.tipo==="embarque"?!t.embarcado:t.embarcado).map(t=><option key={t._id} value={t._id}>{t.nombre} · {t.cargo}</option>)}
            </select>
          </div>
        </div>
        <div className="r2">
          <div><label className="lbl">Fecha {formEmb.tipo==="embarque"?"de Embarque":"de Desembarque"}</label><input type="date" value={formEmb.tipo==="embarque"?formEmb.fEmb:formEmb.fDes} onChange={e=>setFormEmb({...formEmb,[formEmb.tipo==="embarque"?"fEmb":"fDes"]:e.target.value})}/></div>
        </div>
        <div style={{display:"flex",gap:9}}><button className="btn btn-p" onClick={registrarEmbarque} disabled={saving}>{saving?"Guardando...":"Registrar"}</button><button className="btn btn-s" onClick={()=>setShowEmb(false)}>Cancelar</button></div>
      </div>
    </div>}

    {/* Form: Franco */}
    {showFranco&&<div className="card">
      <CT>📅 Registrar Franco Usado</CT>
      <div className="form">
        <div className="r4">
          <div><label className="lbl">Tripulante</label>
            <select value={formFranco.idTrip} onChange={e=>setFormFranco({...formFranco,idTrip:e.target.value})}>
              <option value="">Seleccionar...</option>
              {tripulantes.map(t=><option key={t._id} value={t._id}>{t.nombre}</option>)}
            </select>
          </div>
          <div><label className="lbl">Tipo</label>
            <select value={formFranco.tipo} onChange={e=>setFormFranco({...formFranco,tipo:e.target.value})}>
              <option value="franco">Franco (descuenta saldo)</option>
              <option value="vacaciones">Vacaciones (no descuenta saldo)</option>
            </select>
          </div>
          <div><label className="lbl">Fecha</label><input type="date" value={formFranco.fecha} onChange={e=>setFormFranco({...formFranco,fecha:e.target.value})}/></div>
          <div><label className="lbl">Días</label><input type="number" value={formFranco.dias} onChange={e=>setFormFranco({...formFranco,dias:e.target.value})} placeholder="0"/></div>
        </div>
        {formFranco.tipo==="vacaciones"&&<div className="warn-b">ℹ Las vacaciones NO descuentan del saldo de francos generados.</div>}
        <div><label className="lbl">Observaciones</label><input value={formFranco.obs} onChange={e=>setFormFranco({...formFranco,obs:e.target.value})} placeholder="Motivo, novedades..."/></div>
        <div style={{display:"flex",gap:9}}><button className="btn btn-p" onClick={registrarFranco} disabled={saving}>{saving?"Guardando...":"Registrar"}</button><button className="btn btn-s" onClick={()=>setShowFranco(false)}>Cancelar</button></div>
      </div>
    </div>}

    {/* Vista Resumen - tabla única clara */}
    {vista==="resumen"&&<div className="card">
      <CT>📋 Situación de Francos — Toda la Tripulación</CT>
      <div className="ovfl">
        <table>
          <thead><tr>
            <th>Nombre</th>
            <th>Cargo</th>
            <th>Estado</th>
            <th style={{textAlign:"center"}}>Francos Generados</th>
            <th style={{textAlign:"center"}}>Francos Usados</th>
            <th style={{textAlign:"center"}}>Saldo</th>
            <th>Situación</th>
            <th></th>
          </tr></thead>
          <tbody>
          {resumen.sort((a,b)=>a.saldo-b.saldo).map((t,i)=>{
            const rowBg=t.saldo<0?"rgba(161,28,39,.04)":t.embarcado?"rgba(22,163,74,.03)":"transparent";
            return <tr key={i} style={{background:rowBg}}>
              <td style={{fontWeight:700,fontSize:13}}>{t.nombre}</td>
              <td><span className="badge badge-m" style={{fontSize:9}}>{t.cargo}</span></td>
              <td>{t.embarcado
                ?<span className="badge badge-g">⚓ Embarcado</span>
                :<span className="badge badge-a">🏠 En Tierra ({t.diasEnTierra}d)</span>}
              </td>
              <td style={{textAlign:"center",fontWeight:600}}>{t.totalFrancosGen}</td>
              <td style={{textAlign:"center",fontWeight:600}}>{t.totalFrancosUs}</td>
              <td style={{textAlign:"center"}}>
                {t.saldo>0&&<span style={{color:"#16a34a",fontWeight:800,fontSize:14}}>+{t.saldo}</span>}
                {t.saldo===0&&<span style={{color:"#8a8aaa",fontWeight:600}}>0</span>}
                {t.saldo<0&&<span style={{color:"#A11C27",fontWeight:800,fontSize:14}}>{t.saldo}</span>}
              </td>
              <td style={{fontSize:12}}>
                {t.saldo>0&&!t.embarcado&&<span style={{color:"#16a34a"}}>Empresa le debe {t.saldo}d · Fin franco: {t.finFranco||"—"}</span>}
                {t.saldo>0&&t.embarcado&&<span style={{color:"#16a34a"}}>Empresa le debe {t.saldo}d de franco</span>}
                {t.saldo===0&&<span style={{color:"#8a8aaa"}}>Equilibrado</span>}
                {t.saldo<0&&<span style={{color:"#A11C27",fontWeight:600}}>Tomó {Math.abs(t.saldo)}d extra de franco</span>}
              </td>
              <td><button className="btn btn-s" style={{padding:"3px 8px",fontSize:11,color:"#A11C27",borderColor:"rgba(161,28,39,.3)"}} onClick={async()=>{if(!window.confirm("¿Borrar tripulante "+t.nombre+"?"))return;try{await atDelete("Tripulantes",t._id);setTripulantes(prev=>prev.filter(x=>x._id!==t._id));}catch(err){alert("Error: "+err.message);}}}>✕</button></td>
            </tr>;
          })}
          </tbody>
          <tfoot>
            <tr style={{borderTop:"2px solid #E2E4EA",background:"#F4F5F7"}}>
              <td colSpan="3" style={{fontWeight:700,fontSize:12,padding:"10px 11px",color:"#1a1a2e"}}>TOTALES</td>
              <td style={{textAlign:"center",fontWeight:700,color:"#313280"}}>{resumen.reduce((s,t)=>s+t.totalFrancosGen,0)}</td>
              <td style={{textAlign:"center",fontWeight:700,color:"#313280"}}>{resumen.reduce((s,t)=>s+t.totalFrancosUs,0)}</td>
              <td style={{textAlign:"center"}}></td>
              <td colSpan="2" style={{fontSize:12,padding:"10px 11px"}}>
                {totalSaldoPositivo>0&&<span style={{color:"#16a34a",fontWeight:700,marginRight:16}}>🟢 Empresa adeuda: +{totalSaldoPositivo}d</span>}
                {totalNegativo>0&&<span style={{color:"#A11C27",fontWeight:700}}>🔴 Francos extra tomados: −{totalNegativo}d</span>}
                {totalNegativo===0&&totalSaldoPositivo===0&&<span style={{color:"#8a8aaa"}}>Sin diferencias</span>}
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>}

    {/* Vista Embarques */}
    {vista==="embarques"&&<div className="card">
      <CT>⚓ Historial de Embarques</CT>
      <div className="ovfl">
        <table><thead><tr><th>Nombre</th><th>Cargo</th><th>Embarque</th><th>Desembarque</th><th>Días</th><th>Francos Gen.</th></tr></thead>
          <tbody>{embarques.slice(0,50).map((e,i)=><tr key={i}>
            <td style={{fontWeight:600}}>{e.nombre}</td>
            <td className="m">{tripulantes.find(t=>t.idNum===e.idTrip)?.cargo||"—"}</td>
            <td className="m">{e.fEmb}</td>
            <td className="m">{e.fDes||<span className="badge badge-g">Embarcado</span>}</td>
            <td style={{fontWeight:700,color:"#313280"}}>{e.dias||"—"}</td>
            <td>{e.francos||"—"}</td>
          </tr>)}
          {!embarques.length&&<tr><td colSpan="6" style={{textAlign:"center",color:"#8a8aaa",padding:20}}>Sin registros</td></tr>}
          </tbody>
        </table>
      </div>
    </div>}

    {/* Vista Francos */}
    {vista==="francos"&&<div className="card">
      <CT>📅 Historial de Francos Usados</CT>
      <table><thead><tr><th>Nombre</th><th>Tipo</th><th>Fecha</th><th>Días</th><th>Observaciones</th></tr></thead>
        <tbody>{francosUsados.map((f,i)=><tr key={i}>
          <td style={{fontWeight:600}}>{f.nombre}</td>
          <td>{f.tipo==="vacaciones"?<span className="badge badge-a">Vacaciones</span>:<span className="badge badge-n">Franco</span>}</td>
          <td className="m">{f.fecha}</td>
          <td style={{fontWeight:700,color:f.tipo==="vacaciones"?"#d97706":"#313280"}}>{f.dias}</td>
          <td className="m">{f.obs?f.obs.replace("[VAC] ",""):"—"}</td>
        </tr>)}
        {!francosUsados.length&&<tr><td colSpan="4" style={{textAlign:"center",color:"#8a8aaa",padding:20}}>Sin registros</td></tr>}
        </tbody>
      </table>
    </div>}
  </div>;
}


// ── App principal ──────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[hlId,setHlId]=useState(null);
  const[loading,setLoading]=useState(false);
  const[loadMsg,setLoadMsg]=useState("Cargando datos...");

  // Data state
  const[eventos,setEventos]=useState([]);
  const[trafico,setTrafico]=useState([]);
  const[mant,setMant]=useState([]);
  const[inc,setInc]=useState([]);
  const[comb,setComb]=useState([]);
  const[log,setLog]=useState([]);
  const[inv,setInv]=useState([]);
  const[alarmas,setAlarmas]=useState([]);
  const[reu,setReu]=useState([]);
  const[actas,setActas]=useState([]);
  const[turnos,setTurnos]=useState(TURNOS_I);
  const[tripulantes,setTripulantes]=useState([]);
  const[embarques,setEmbarques]=useState([]);
  const[francosUsados,setFrancosUsados]=useState([]);
  const[tipos,setTipos]=useState(TIPOS_I);

  const navTo=(p,id=null)=>{setPage(p);setHlId(id);};

  const loadData=async()=>{
    setLoading(true);
    try{
      setLoadMsg("Cargando eventos...");
      const [evRecs,trRecs,maRecs,inRecs,coRecs,loRecs,ivRecs,alRecs,reRecs,acRecs,tripRecs,embRecs,francRecs]=await Promise.all([
        atList("Eventos"),atList("Trafico"),atList("Mantenimiento"),atList("Incidentes"),
        atList("Combustible"),atList("Logbook"),atList("Inventario"),atList("Alarmas"),
        atList("Reuniones"),atList("ActasMando"),atList("Tripulantes"),atList("Embarques"),atList("FrancosUsados"),
      ]);
      setEventos(evRecs.map(mappers.Eventos.from).sort((a,b)=>new Date(b.ts)-new Date(a.ts)));
      setTrafico(trRecs.map(mappers.Trafico.from).sort((a,b)=>new Date(b.ts)-new Date(a.ts)));
      setMant(maRecs.map(mappers.Mantenimiento.from));
      setInc(inRecs.map(mappers.Incidentes.from).sort((a,b)=>new Date(b.fRep)-new Date(a.fRep)));
      setComb(coRecs.map(mappers.Combustible.from).sort((a,b)=>a.fecha.localeCompare(b.fecha)));
      setLog(loRecs.map(mappers.Logbook.from).sort((a,b)=>a.fecha.localeCompare(b.fecha)));
      setInv(ivRecs.map(mappers.Inventario.from));
      setAlarmas(alRecs.map(mappers.Alarmas.from).sort((a,b)=>a.fecha.localeCompare(b.fecha)));
      setReu(reRecs.map(mappers.Reuniones.from).sort((a,b)=>a.fecha.localeCompare(b.fecha)));
      setActas(acRecs.map(mappers.ActasMando.from).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)));
      setTripulantes(tripRecs.map(mapTrip.from).sort((a,b)=>a.nombre.localeCompare(b.nombre)));
      setEmbarques(embRecs.map(mapEmb.from).sort((a,b)=>b.fEmb.localeCompare(a.fEmb)));
      setFrancosUsados(francRecs.map(mapFrancos.from).sort((a,b)=>b.fecha.localeCompare(a.fecha)));
      setLoadMsg("¡Listo!");
    }catch(e){
      console.error("Error cargando datos:",e);
      setLoadMsg("Error: "+e.message);
      await new Promise(r=>setTimeout(r,2000));
    }
    setLoading(false);
  };

  const handleLogin=async(u)=>{
    setUser(u);
    await loadData();
    setPage(u.role==="gerente"||u.role==="capitan"?"dashboard":"reporte_op");
  };

  if(!user) return <Login onLogin={handleLogin}/>;
  if(loading) return <Loading msg={loadMsg}/>;

  const groups=NAV.map(g=>({...g,items:g.items.map(n=>({...n,ok:n.roles.includes(user.role)}))}));

  return <div className="app">
    <header className="hdr">
      <div className="hdr-l">
        <Logo h={32}/>
        <div className="hdr-div"/>
        <div><div className="hdr-t">Sistema Operativo</div><div className="hdr-s">Dragados del Paraguay</div></div>
      </div>
      <div className="hdr-r">
        <div className="ubadge"><div className="odot"/><span className={"rpill "+RPILL[user.role]}>{ROLES_LABEL[user.role]}</span><span className="uname">{user.name}</span></div>
        <button className="btn-out" onClick={()=>{setUser(null);setEventos([]);setTrafico([]);setMant([]);setInc([]);setComb([]);setLog([]);setInv([]);setAlarmas([]);setReu([]);setActas([]);}}>Salir</button>
      </div>
    </header>
    <div className="body">
      <nav className="sb">
        {groups.map(g=><div key={g.group}>
          <div className="sg">{g.group}</div>
          {g.items.map(n=><div key={n.id} className={"ni"+(page===n.id?" act":"")+(n.ok?"":" lk")} onClick={()=>n.ok&&navTo(n.id)}>
            <span className="ni-ic">{n.icon}</span><span>{n.label}</span>{!n.ok&&<span className="ni-lk">🔒</span>}
          </div>)}
        </div>)}
        <div className="sf"><div className="sf-n">{user.name}</div><div className="sf-s">{user.cargo}</div><div className="sf-v">DDP · v1.0 · 2026</div></div>
      </nav>
      <main className="main">
        {page==="dashboard"     &&<Dashboard eventos={eventos} mant={mant} inc={inc} alarmas={alarmas} inv={inv} navTo={navTo}/>}
        {page==="reporte_op"    &&<ReporteOp eventos={eventos} setEventos={setEventos} user={user} turnos={turnos} tipos={tipos}/>}
        {page==="trafico"       &&<Trafico trafico={trafico} setTrafico={setTrafico} user={user}/>}
        {page==="rep_semanal"   &&<RepSemanal user={user}/>}
        {page==="logbook"       &&<Logbook log={log} setLog={setLog} user={user}/>}
        {page==="combustible"   &&<Combustible comb={comb} setComb={setComb} user={user}/>}
        {page==="mantenimiento" &&<Mantenimiento mant={mant} setMant={setMant} user={user} hlId={hlId}/>}
        {page==="alarmas"       &&<Alarmas user={user} alarmas={alarmas} setAlarmas={setAlarmas}/>}
        {page==="inventario"    &&<Inventario inv={inv} setInv={setInv} user={user} hlId={hlId}/>}
        {page==="incidentes"    &&<Incidentes inc={inc} setInc={setInc} user={user} hlId={hlId}/>}
        {page==="actas"         &&<Actas user={user} actas={actas} setActas={setActas}/>}
        {page==="reuniones"     &&<Reuniones reu={reu} setReu={setReu} user={user}/>}
        {page==="usuarios"       &&<Usuarios/>}
        {page==="config"        &&<Config turnos={turnos} setTurnos={setTurnos} tipos={tipos} setTipos={setTipos}/>}
        {page==="procedimientos" &&<Procedimientos user={user}/>}
        {page==="tripulacion"   &&<Tripulacion tripulantes={tripulantes} setTripulantes={setTripulantes} embarques={embarques} setEmbarques={setEmbarques} francosUsados={francosUsados} setFrancosUsados={setFrancosUsados} user={user}/>}
      </main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
